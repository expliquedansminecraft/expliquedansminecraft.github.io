<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="YouTube, Instagram et Discord d'Expliqué dans Minecraft.">
<style>*{box-sizing:border-box}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Expliqué dans Minecraft</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Rubik:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column on a deepslate night, Minecraft-style bevelled buttons, emerald accent. Single deliberate dark look. */
:root{
  --bg:#17191d;
  --bg-2:#20242a;
  --stone:#6f6f6f;
  --stone-hi:#a8a8a8;
  --stone-lo:#3a3a3a;
  --fg:#f2f2ee;
  --muted:#a9b0a6;
  --emerald:#3ddc6e;
  --font-display:"Silkscreen","Courier New",monospace;
  --font-body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{
  background:
    radial-gradient(120% 60% at 50% 0%, #22302a 0%, transparent 60%),
    var(--bg);
  color:var(--fg);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.5;
}
.wrap{
  max-width:460px;margin:0 auto;
  padding-block:56px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;align-items:center;gap:28px;
}
.block{width:96px;height:96px;image-rendering:pixelated;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
header{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
h1{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(22px,6.4vw,30px);line-height:1.15;margin:0;
  text-wrap:balance;letter-spacing:.01em;
  text-shadow:3px 3px 0 #000;
}
.tag{margin:0;color:var(--muted);font-size:15px;max-width:32ch}
.handle{font-family:var(--font-display);font-size:12px;color:var(--emerald);letter-spacing:.06em}
nav{width:100%;display:flex;flex-direction:column;gap:14px}
a.btn{
  --c:var(--stone);
  display:grid;grid-template-columns:40px 1fr 20px;align-items:center;gap:12px;
  padding:12px 16px;text-decoration:none;color:var(--fg);
  background:var(--c);
  border:3px solid #000;
  box-shadow:inset 3px 3px 0 var(--stone-hi), inset -3px -4px 0 var(--stone-lo);
  font-family:var(--font-display);font-size:15px;letter-spacing:.02em;
  text-shadow:2px 2px 0 #3f3f3f;
}
a.btn small{display:block;font-family:var(--font-body);font-size:13px;letter-spacing:0;text-shadow:none;color:#e4e4e0;opacity:.9}
a.btn .ic{width:40px;height:40px;display:grid;place-items:center;border:2px solid #000}
a.btn .ic svg{width:22px;height:22px}
a.btn .arrow{font-family:var(--font-display);font-size:16px}
a.btn:hover,a.btn:focus-visible{
  --c:#7e86b8;
  box-shadow:inset 3px 3px 0 #b6bdee, inset -3px -4px 0 #4a5180;
  outline:none;
}
a.btn:focus-visible{border-color:#fff}
a.btn:active{transform:translateY(2px)}
.yt .ic{background:#e62117}
.ig .ic{background:linear-gradient(135deg,#f9a63a,#e1306c 50%,#7b3fe4)}
.dc .ic{background:#5865f2}
footer{font-family:var(--font-display);font-size:11px;color:#6d756b;letter-spacing:.08em;text-align:center}
@media (prefers-reduced-motion:reduce){a.btn:active{transform:none}}
</style>
</head>
<body>

<div class="wrap">
  <canvas class="block" id="block" width="16" height="16" aria-hidden="true"></canvas>

  <header>
    <h1>Expliqué dans Minecraft</h1>
    <span class="handle">@expliquedansminecraft</span>
    <p class="tag">L'économie, la politique et l'actualité, expliquées avec des blocs.</p>
  </header>

  <nav>
    <a class="btn yt" href="https://www.youtube.com/@expliqueavecminecraft" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span>
      <span>YouTube<small>Les vidéos longues et les shorts</small></span>
      <span class="arrow">&gt;</span>
    </a>
    <a class="btn ig" href="https://www.instagram.com/expliquedansminecraft/" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="#fff" stroke="none"/></svg></span>
      <span>Instagram<small>@expliquedansminecraft</small></span>
      <span class="arrow">&gt;</span>
    </a>
    <a class="btn dc" href="https://discord.gg/VwkwH2C5RF" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24" fill="#fff"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-6l-5 4v-4H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/><circle cx="9" cy="11" r="1.6" fill="#5865f2"/><circle cx="15" cy="11" r="1.6" fill="#5865f2"/></svg></span>
      <span>Discord<small>Rejoins Le Village</small></span>
      <span class="arrow">&gt;</span>
    </a>
  </nav>

  <footer>Expliqué dans Minecraft</footer>
</div>

<script>
// Petit bloc d'herbe en pixels (bruit fixe, pas de hasard)
(function(){
  var c=document.getElementById('block');if(!c)return;var x=c.getContext('2d');
  var s=7;function r(){s=(s*16807)%2147483647;return s/2147483647;}
  var dirt=['#8b5a2b','#79502a','#96643a','#6b4423'],grass=['#5fae3a','#4f9a2f','#6cc046','#47892a'];
  for(var j=0;j<16;j++)for(var i=0;i<16;i++){
    var edge=4+Math.floor(r()*3);
    var pal=j<edge?grass:dirt;
    x.fillStyle=pal[Math.floor(r()*pal.length)];x.fillRect(i,j,1,1);
  }
})();
</script>

</body>
</html>
